<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Emberflight Gauntlet • The Dragon Crew</title>
  <style>
    :root {
      --bg: #050203;
      --ember: #ff5a1f;
      --gold: #f4d35e;
      --heat: #ff9f4d;
      --void: #120a08;
      --text: #f2e9d8;
      --muted: #8a6f5c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    #hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      font-size: 13px; letter-spacing: 0.5px; color: var(--text);
    }
    .hud-top { position: absolute; top: 16px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; }
    .hud-stat { background: rgba(5,2,3,0.6); border: 1px solid rgba(244,211,94,0.15); padding: 4px 10px; border-radius: 999px; backdrop-filter: blur(6px); }
    .hud-stat span { font-weight: 600; color: var(--gold); }
    #combo { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(255,90,31,0.12); border: 1px solid rgba(255,90,31,0.3); padding: 2px 14px; border-radius: 999px; font-size: 12px; opacity: 0.9; }
    #boost {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      width: min(320px, 70vw); height: 6px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden;
      border: 1px solid rgba(244,211,94,0.2);
    }
    #boost > i { display: block; height: 100%; background: linear-gradient(90deg, var(--ember), var(--gold)); width: 0%; transition: width 60ms linear; }
    #status {
      position: absolute; bottom: 42px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase;
    }
    #crash {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20;
      background: rgba(5,2,3,0.82); flex-direction: column; gap: 12px; text-align: center;
    }
    #crash.visible { display: flex; }
    #crash h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 1.5px; color: #f2c9a8; }
    #crash .score { font-size: 15px; color: var(--gold); margin: 4px 0 8px; }
    #crash button {
      pointer-events: auto; border: 1px solid rgba(244,211,94,0.4); background: rgba(255,90,31,0.1);
      color: var(--text); padding: 10px 28px; border-radius: 999px; font-size: 14px; cursor: pointer;
      transition: all 120ms ease;
    }
    #crash button:hover { background: rgba(255,90,31,0.2); border-color: var(--gold); }
    .prompt {
      position: fixed; bottom: 22%; left: 50%; transform: translateX(-50%);
      font-size: 13px; color: var(--muted); letter-spacing: 0.8px; pointer-events: none; z-index: 15;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }
    .prompt.hidden { opacity: 0; transition: opacity 300ms ease; }
    .float { position: absolute; font-size: 12px; color: var(--gold); pointer-events: none; z-index: 12; text-shadow: 0 0 8px rgba(255,90,31,0.6); }
  </style>
</head>
<body>
  <canvas id="c" width="1280" height="720"></canvas>

  <div id="hud">
    <div class="hud-top">
      <div class="hud-stat">GAUNTLET <span id="dist">000</span>m</div>
      <div class="hud-stat">EMBERS <span id="embers">00</span></div>
    </div>
    <div id="combo">COMBO <span id="combo-val">×1</span></div>
    <div id="boost"><i id="boost-bar"></i></div>
    <div id="status">WEAVE • DASH • CHAIN</div>
  </div>

  <div id="crash">
    <h1>THE SKY TOOK YOU</h1>
    <div class="score">Embers: <span id="final-embers">0</span> • Chain: <span id="final-combo">×1</span> • <span id="final-dist">0</span>m</div>
    <button id="restart-btn">FLY AGAIN</button>
    <div style="font-size:11px; color:#6a5346; margin-top:4px;">Press R or tap anywhere</div>
  </div>

  <div id="prompt" class="prompt">click or tap to take wing • arrows / drag to steer • space / tap to dash</div>

  <script>
  "use strict";

  // ============================================================
  // EMBERFLIGHT GAUNTLET — Taste-Gate Slice
  // One verb (weave + timed dash), one space (burning sky gauntlet)
  // Dragon Crew house style: weight, heat, consequence, mythic presence
  // ============================================================

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
  let W = 1280, H = 720, DPR = 1;

  // House palette
  const PAL = {
    bgDeep: '#050203',
    bgHeat: '#120a08',
    ember: '#ff5a1f',
    gold: '#f4d35e',
    heat: '#ff9f4d',
    flame: '#ff7a3d',
    rock: '#1f1612',
    rockEdge: '#3a2a22',
    rider: '#c8a17a',
    void: '#0a0504'
  };

  // Game constants (tuned for juicy 30-60s slice)
  const BASE_SPEED = 1.85;
  const BOOST_SPEED = 3.35;
  const PLAYER_INERTIA = 0.082;
  const DASH_BOOST_SEC = 0.72;
  const DASH_COST = 0.28;
  const BOOST_RECHARGE = 0.018;
  const MAX_COMBO = 12;
  const COMBO_DECAY_PER_SEC = 0.9;
  const HAZARD_SPAWN_MIN = 420;
  const HAZARD_SPAWN_MAX = 680;
  const EMBER_SPAWN = 210;
  const GRAZE_SPAWN = 920;
  const PLAY_TOP = 0.18;
  const PLAY_BOT = 0.82;

  // State
  let mode = 'ready'; // ready | playing | crashed
  let worldX = 0;
  let speed = BASE_SPEED;
  let playerY = 0.5; // 0..1 normalized play band
  let playerVY = 0;
  let boost = 0.65; // 0..1
  let boostUntil = 0;
  let lastDashAt = 0;
  let distance = 0;
  let embers = 0;
  let combo = 1;
  let comboTimer = 0;
  let lastSpawnHazard = 0;
  let lastSpawnEmber = 0;
  let lastSpawnGraze = 0;
  let nextHazardAt = 380;
  let nextEmberAt = 240;
  let nextGrazeAt = 1100;
  let time = 0;
  let lastT = 0;
  let shake = 0;
  let flash = 0;
  let firstInteraction = false;

  // Escalation boss: Sky Maw (clear beat after distance gate)
  let maw = null; // {x, phase, passed}

  // Entities (lightweight, no class overhead in hot path)
  let hazards = []; // {x, y, kind:'spire'|'vent', h, phase}
  let embersArr = []; // {x, y, vy}
  let grazes = []; // {x, y}
  let particles = []; // {x,y,vx,vy,life,sz,col,rot}

  // Input
  let steerTarget = 0.5;
  let dashRequested = false;
  let pointerDown = false;
  let pointerY = 0.5;
  let keys = {};

  // Audio (post-gesture only)
  let audioCtx = null;
  let masterGain = null;
  let windGain = null;
  let windOsc = null;
  let windFilter = null;
  let audioStarted = false;

  // Pools
  const MAX_PART = 280;
  let partPool = [];

  function initPools() {
    partPool.length = 0;
    for (let i = 0; i < MAX_PART; i++) partPool.push({});
  }

  function spawnParticle(x, y, vx, vy, life, sz, col) {
    let p = partPool.pop() || {};
    p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.sz = sz; p.col = col; p.rot = Math.random()*Math.PI*2;
    particles.push(p);
    if (particles.length > MAX_PART) {
      const dead = particles.shift();
      if (dead) partPool.push(dead);
    }
  }

  // Easing (all motion uses curves)
  const Ease = {
    outCubic(t) { return 1 - Math.pow(1 - t, 3); },
    inOutQuad(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; },
    outExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); },
    damp(cur, tgt, k, dt) { return cur + (tgt - cur) * Math.min(1, k * dt * 60); }
  };

  // ============================================================
  // AUDIO — Fire / Sky / Weight (only after gesture)
  // ============================================================
  function initAudio() {
    if (audioStarted) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0; // start silent, ramp on first action
      masterGain.connect(audioCtx.destination);

      // Wind + low fire rumble
      windFilter = audioCtx.createBiquadFilter();
      windFilter.type = 'lowpass';
      windFilter.frequency.value = 420;
      windGain = audioCtx.createGain();
      windGain.gain.value = 0.0001;
      windOsc = audioCtx.createOscillator();
      windOsc.type = 'sawtooth';
      windOsc.frequency.value = 38;

      const windNoise = audioCtx.createBufferSource();
      const noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 3, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      windNoise.buffer = noiseBuf;
      windNoise.loop = true;

      const noiseF = audioCtx.createBiquadFilter();
      noiseF.type = 'bandpass';
      noiseF.frequency.value = 180;
      noiseF.Q.value = 0.6;

      const windG2 = audioCtx.createGain();
      windG2.gain.value = 0.7;

      windOsc.connect(windFilter);
      windNoise.connect(noiseF);
      noiseF.connect(windG2);
      windFilter.connect(windGain);
      windG2.connect(windGain);
      windGain.connect(masterGain);

      windOsc.start();
      windNoise.start();
      audioStarted = true;
    } catch (e) { /* audio optional */ }
  }

  function rampMaster(v, t = 0.08) {
    if (!masterGain || !audioCtx) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setTargetAtTime(Math.max(0.0001, v), now, t);
  }

  function playDash() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    // Low roar whoosh
    const o = audioCtx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.value = 62;
    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 680;
    const g = audioCtx.createGain();
    g.gain.value = 0.18;
    g.gain.setValueAtTime(0.18, now);
    g.gain.linearRampToValueAtTime(0.0001, now + 0.85);
    const n = audioCtx.createBufferSource();
    const nb = audioCtx.createBuffer(1, audioCtx.sampleRate * 1.2, audioCtx.sampleRate);
    const d = nb.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    n.buffer = nb;
    const nf = audioCtx.createBiquadFilter();
    nf.type = 'bandpass';
    nf.frequency.value = 320;
    nf.Q.value = 1.4;
    const ng = audioCtx.createGain();
    ng.gain.value = 0.12;
    ng.gain.setValueAtTime(0.12, now);
    ng.gain.linearRampToValueAtTime(0.0001, now + 0.6);

    o.connect(f); f.connect(g); g.connect(masterGain);
    n.connect(nf); nf.connect(ng); ng.connect(masterGain);
    o.start(now);
    n.start(now);
    o.stop(now + 1.0);
    n.stop(now + 1.0);

    // Heat crackle tail
    const c = audioCtx.createOscillator();
    c.type = 'triangle';
    c.frequency.value = 920;
    const cg = audioCtx.createGain();
    cg.gain.value = 0.035;
    cg.gain.linearRampToValueAtTime(0.0001, now + 0.55);
    c.connect(cg); cg.connect(masterGain);
    c.start(now + 0.03);
    c.stop(now + 0.7);
  }

  function playEmber(xNorm) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const base = 620 + (xNorm - 0.5) * 180;
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = base;
    const g = audioCtx.createGain();
    g.gain.value = 0.09;
    g.gain.setValueAtTime(0.09, now);
    g.gain.exponentialRampToValueAtTime(0.0008, now + 0.38);
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 420;
    o.connect(hp); hp.connect(g); g.connect(masterGain);
    o.start(now);
    o.stop(now + 0.5);

    // Soft gold harmonic
    const o2 = audioCtx.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = base * 1.52;
    const g2 = audioCtx.createGain();
    g2.gain.value = 0.035;
    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
    o2.connect(g2); g2.connect(masterGain);
    o2.start(now + 0.01);
    o2.stop(now + 0.65);
  }

  function playGraze() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = 780;
    const g = audioCtx.createGain();
    g.gain.value = 0.065;
    g.gain.setValueAtTime(0.065, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
    o.connect(g); g.connect(masterGain);
    o.start(now);
    o.stop(now + 1.1);
  }

  function playCrash() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.value = 48;
    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 240;
    const g = audioCtx.createGain();
    g.gain.value = 0.35;
    g.gain.setValueAtTime(0.35, now);
    g.gain.linearRampToValueAtTime(0.0001, now + 1.2);
    o.connect(f); f.connect(g); g.connect(masterGain);
    o.start(now);
    o.stop(now + 1.4);

    // Debris hit
    const n = audioCtx.createBufferSource();
    const nb = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.8, audioCtx.sampleRate);
    const d = nb.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
    n.buffer = nb;
    const ng = audioCtx.createGain();
    ng.gain.value = 0.22;
    ng.gain.linearRampToValueAtTime(0.0001, now + 0.5);
    n.connect(ng); ng.connect(masterGain);
    n.start(now);
  }

  function updateAudio(dt) {
    if (!audioCtx || !windGain) return;
    const targetWind = mode === 'playing' ? (0.018 + (speed - BASE_SPEED) * 0.022) : 0.003;
    windGain.gain.setTargetAtTime(targetWind, audioCtx.currentTime, 0.12);
    if (windFilter) {
      const targetF = 280 + (speed - BASE_SPEED) * 260 + (boost * 180);
      windFilter.frequency.setTargetAtTime(targetF, audioCtx.currentTime, 0.09);
    }
  }

  // ============================================================
  // INPUT — immediate response, multi-modal, post-gesture audio
  // ============================================================
  function setSteerFromClient(clientY) {
    const rect = canvas.getBoundingClientRect();
    const ny = (clientY - rect.top) / rect.height;
    const band = PLAY_BOT - PLAY_TOP;
    steerTarget = Math.max(0, Math.min(1, (ny - PLAY_TOP) / band));
  }

  function requestDash() {
    if (mode !== 'playing') return;
    if (boost < DASH_COST * 0.6) return;
    dashRequested = true;
  }

  function onPointerDown(e) {
    e.preventDefault();
    if (!firstInteraction) {
      firstInteraction = true;
      initAudio();
      rampMaster(0.72, 0.06);
      if (mode === 'ready') startRun();
    }
    pointerDown = true;
    pointerY = e.clientY;
    setSteerFromClient(e.clientY);
    // Quick tap (no move) triggers dash
    setTimeout(() => {
      if (pointerDown && Math.abs(e.clientY - pointerY) < 12) requestDash();
    }, 110);
  }
  function onPointerMove(e) {
    if (!pointerDown) return;
    e.preventDefault();
    setSteerFromClient(e.clientY);
  }
  function onPointerUp(e) {
    e.preventDefault();
    pointerDown = false;
  }

  function onKeyDown(e) {
    keys[e.key] = true;
    if (!firstInteraction) {
      firstInteraction = true;
      initAudio();
      rampMaster(0.72, 0.06);
      if (mode === 'ready') startRun();
    }
    if (mode === 'playing') {
      if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); requestDash(); }
      if (e.key.toLowerCase() === 'r') { /* allow restart later */ }
    }
    if ((mode === 'crashed' || mode === 'ready') && (e.key === ' ' || e.key === 'r' || e.key === 'R' || e.key === 'Enter')) {
      e.preventDefault();
      restart();
    }
  }
  function onKeyUp(e) { keys[e.key] = false; }

  function bindInput() {
    canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', onPointerUp, { passive: false });
    canvas.addEventListener('touchstart', (e) => { onPointerDown({preventDefault:()=>{}, clientY: e.touches[0].clientY}); }, {passive:false});
    window.addEventListener('touchmove', (e) => { onPointerMove({preventDefault:()=>{}, clientY: e.touches[0].clientY}); }, {passive:false});
    window.addEventListener('touchend', onPointerUp, {passive:false});
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    // Also allow dash on canvas click when playing
    canvas.addEventListener('click', (e) => {
      if (mode === 'playing' && !pointerDown) requestDash();
      if (mode === 'crashed') restart();
    });
  }

  function updateInput(dt) {
    // Keyboard steer
    let k = 0;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) k -= 1;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) k += 1;
    if (k !== 0) {
      steerTarget = Math.max(0, Math.min(1, steerTarget + k * 1.6 * dt));
    }
    // Pointer already writes steerTarget directly
    // Dash from held space
    if ((keys[' '] || keys['Spacebar']) && mode === 'playing') requestDash();
  }

  // ============================================================
  // WORLD / ENTITIES
  // ============================================================
  function resetWorld() {
    worldX = 0;
    speed = BASE_SPEED;
    hazards.length = 0;
    embersArr.length = 0;
    grazes.length = 0;
    particles.length = 0;
    distance = 0;
    embers = 0;
    combo = 1;
    comboTimer = 0;
    boost = 0.72;
    boostUntil = 0;
    lastSpawnHazard = 0;
    lastSpawnEmber = 0;
    lastSpawnGraze = 0;
    nextHazardAt = 260 + Math.random() * 140;
    nextEmberAt = 140 + Math.random() * 90;
    nextGrazeAt = 780 + Math.random() * 260;
    shake = 0;
    flash = 0;
    maw = null;
    playerY = 0.5;
    playerVY = 0;
    steerTarget = 0.5;
  }

  function startRun() {
    mode = 'playing';
    resetWorld();
    document.getElementById('prompt').classList.add('hidden');
    // Seed a couple early embers so first 8s has something to do
    embersArr.push({ x: worldX + 420, y: 0.32 + Math.random()*0.36 });
    embersArr.push({ x: worldX + 780, y: 0.28 + Math.random()*0.42 });
  }

  function crash() {
    if (mode !== 'playing') return;
    mode = 'crashed';
    playCrash();
    rampMaster(0.18, 0.4);
    shake = 22;
    flash = 0.9;
    // Big crash burst
    for (let i = 0; i < 38; i++) {
      const ang = (i/38) * Math.PI * 2 + (Math.random()-0.5)*0.6;
      const sp = 0.6 + Math.random()*2.8;
      spawnParticle(W*0.28, playerScreenY(), Math.cos(ang)*sp, Math.sin(ang)*sp*0.7 - 0.4,
        0.6 + Math.random()*0.7, 1.6 + Math.random()*2.2, i%3===0 ? PAL.gold : PAL.ember);
    }
    // Show crash UI
    document.getElementById('final-embers').textContent = embers;
    document.getElementById('final-combo').textContent = '×' + combo;
    document.getElementById('final-dist').textContent = Math.floor(distance);
    document.getElementById('crash').classList.add('visible');
  }

  function restart() {
    document.getElementById('crash').classList.remove('visible');
    document.getElementById('prompt').classList.remove('hidden');
    mode = 'ready';
    resetWorld();
    playerY = 0.5;
    steerTarget = 0.5;
    rampMaster(0.0, 0.01);
    // Ready for next gesture to start
  }

  function playerScreenY() {
    const bandH = H * (PLAY_BOT - PLAY_TOP);
    return H * PLAY_TOP + playerY * bandH;
  }

  function spawnHazard() {
    const y = PLAY_TOP + Math.random() * (PLAY_BOT - PLAY_TOP);
    const kind = Math.random() < 0.62 ? 'spire' : 'vent';
    const h = kind === 'spire' ? (0.09 + Math.random()*0.11) : (0.07 + Math.random()*0.06);
    hazards.push({ x: worldX + W * 0.92 + Math.random()*120, y, kind, h, phase: Math.random()*Math.PI*2 });
    nextHazardAt = worldX + HAZARD_SPAWN_MIN + Math.random()*(HAZARD_SPAWN_MAX - HAZARD_SPAWN_MIN);
  }

  function spawnEmber() {
    const y = PLAY_TOP + 0.08 + Math.random() * (PLAY_BOT - PLAY_TOP - 0.16);
    embersArr.push({ x: worldX + W * 0.9 + Math.random()*80, y, vy: (Math.random()-0.5)*0.018 });
    nextEmberAt = worldX + EMBER_SPAWN + Math.random()*90;
  }

  function spawnGraze() {
    const y = PLAY_TOP + 0.12 + Math.random() * (PLAY_BOT - PLAY_TOP - 0.24);
    grazes.push({ x: worldX + W * 0.88 + Math.random()*140, y });
    nextGrazeAt = worldX + GRAZE_SPAWN + Math.random()*220;
  }

  function updateWorld(dt) {
    if (mode !== 'playing') return;

    const isBoost = time < boostUntil;
    speed = isBoost ? BOOST_SPEED : BASE_SPEED;

    // Advance
    const move = speed * 62 * dt;
    worldX += move;
    distance += move * 0.021; // tuned meters feel

    // Player motion (inertia + easing to steerTarget)
    const bandH = (PLAY_BOT - PLAY_TOP);
    const tgtY = steerTarget;
    playerVY = Ease.damp(playerVY, (tgtY - playerY) * 2.8, PLAYER_INERTIA, dt);
    playerY += playerVY * dt * 60;
    playerY = Math.max(0.01, Math.min(0.99, playerY));

    // Boost logic
    if (isBoost) {
      boost = Math.max(0.04, boost - 0.9 * dt);
    } else {
      boost = Math.min(1, boost + BOOST_RECHARGE * dt);
    }
    if (dashRequested && boost >= DASH_COST * 0.55 && time > lastDashAt + 0.22) {
      boostUntil = time + DASH_BOOST_SEC;
      boost = Math.max(0.03, boost - DASH_COST);
      lastDashAt = time;
      playDash();
      // Dash juice: forward surge particles + wing wake
      const py = playerScreenY();
      for (let i=0; i<14; i++) {
        spawnParticle(W*0.26, py + (Math.random()-0.5)*28,
          -1.8 - Math.random()*1.4, (Math.random()-0.5)*1.6,
          0.28 + Math.random()*0.25, 1.4 + Math.random()*1.1, PAL.gold);
      }
      shake = Math.max(shake, 4.5);
      flash = Math.max(flash, 0.22);
    }
    dashRequested = false;

    // Combo decay
    comboTimer += dt;
    if (comboTimer > 0.9) {
      comboTimer = 0;
      if (combo > 1) combo = Math.max(1, combo - COMBO_DECAY_PER_SEC * 0.6);
    }

    // Spawns
    if (worldX > nextHazardAt) spawnHazard();
    if (worldX > nextEmberAt) spawnEmber();
    if (worldX > nextGrazeAt && embers > 1) spawnGraze();

    // Move & collide hazards
    for (let i = hazards.length-1; i>=0; i--) {
      const hz = hazards[i];
      const sx = (hz.x - worldX);
      if (sx < -80) { hazards.splice(i,1); continue; }
      // Simple AABB vs dragon core
      const py = playerScreenY();
      const hx = W*0.26 + (sx / (W*0.9)) * (W*0.5);
      const hy = H*PLAY_TOP + hz.y * H*(PLAY_BOT-PLAY_TOP);
      const hh = hz.h * H * 0.9;
      const hit = (Math.abs(hx - W*0.26) < 26) && (Math.abs(py - hy) < hh*0.48);
      if (hit) {
        // consequence
        crash();
        return;
      }
      // Near-miss heat flash (small)
      if (Math.abs(hx - W*0.26) < 52 && Math.abs(py - hy) < hh*0.9) {
        flash = Math.max(flash, 0.08);
      }
    }

    // Embers
    for (let i=embersArr.length-1; i>=0; i--) {
      const e = embersArr[i];
      e.x -= move * 0.6; // slower than world for depth
      e.y += e.vy;
      e.vy *= 0.982;
      const sx = (e.x - worldX);
      if (sx < -40) { embersArr.splice(i,1); continue; }
      const py = playerScreenY();
      const ex = W*0.26 + (sx / (W*0.9)) * (W*0.5);
      const ey = H*PLAY_TOP + e.y * H*(PLAY_BOT-PLAY_TOP);
      if (Math.hypot(ex - W*0.26, ey - py) < 26) {
        // collect
        embersArr.splice(i,1);
        embers++;
        const gained = Math.floor(3 + combo * 0.6);
        // combo
        combo = Math.min(MAX_COMBO, combo + 0.7);
        comboTimer = 0;
        // score pop
        spawnFloatText('+' + gained, ex + 8, ey - 18, 820);
        playEmber((ex / W));
        // recharge boost slightly + particles
        boost = Math.min(1, boost + 0.11);
        for (let k=0; k<7; k++) {
          spawnParticle(ex, ey, (Math.random()-0.5)*1.6, (Math.random()-0.5)*1.2 - 0.6,
            0.4 + Math.random()*0.35, 1.1 + Math.random()*1.3, PAL.gold);
        }
        shake = Math.max(shake, 1.5);
      }
    }

    // Grazes (rescue allies)
    for (let i=grazes.length-1; i>=0; i--) {
      const g = grazes[i];
      g.x -= move * 0.52;
      const sx = (g.x - worldX);
      if (sx < -50) { grazes.splice(i,1); continue; }
      const py = playerScreenY();
      const gx = W*0.26 + (sx / (W*0.9)) * (W*0.5);
      const gy = H*PLAY_TOP + g.y * H*(PLAY_BOT-PLAY_TOP);
      if (Math.hypot(gx - W*0.26, gy - py) < 32) {
        grazes.splice(i,1);
        combo = Math.min(MAX_COMBO, combo + 1.6);
        comboTimer = 0;
        embers += 2;
        spawnFloatText('RESCUED', gx + 6, gy - 24, 1100);
        playGraze();
        boost = Math.min(1, boost + 0.19);
        for (let k=0; k<11; k++) {
          spawnParticle(gx, gy, (Math.random()-0.5)*2.1, (Math.random()-0.5)*1.8 - 0.8,
            0.55 + Math.random()*0.4, 1.0 + Math.random()*1.4, k%2 ? PAL.heat : PAL.gold);
        }
        flash = Math.max(flash, 0.18);
      }
    }

    // Sky Maw escalation (clear boss beat: undulating flame serpent with weave gaps)
    if (!maw && distance > 780 && mode === 'playing') {
      maw = { x: worldX + W * 1.05, phase: 0, passed: false };
      // dramatic entrance FX
      const my = playerScreenY();
      for (let k=0; k<18; k++) {
        spawnParticle(W*0.78, my + (k-9)*3.5, -0.6 - Math.random()*0.8, (Math.random()-0.5)*1.1,
          0.6 + Math.random()*0.5, 2.2 + Math.random()*1.4, k%2 ? PAL.heat : PAL.ember);
      }
      flash = Math.max(flash, 0.35);
      shake = Math.max(shake, 7);
    }
    if (maw) {
      maw.phase += dt * 1.8;
      const mMove = speed * 58 * dt;
      maw.x -= mMove * 0.78; // slightly slower for presence/weight
      const sx = (maw.x - worldX);
      if (sx < -W * 0.6 && !maw.passed) {
        // passed cleanly
        maw.passed = true;
        const bonus = 28 + Math.floor(combo * 1.8);
        embers += 3;
        combo = Math.min(MAX_COMBO, combo + 2.2);
        comboTimer = 0;
        spawnFloatText('MAW CHAIN +' + bonus, W*0.5 - 40, H*0.42, 1400);
        for (let k=0; k<16; k++) {
          spawnParticle(W*0.32, H*0.5 + (k-8)*2, -2.2 + Math.random()*1.4, (Math.random()-0.5)*2.6,
            0.7 + Math.random()*0.4, 1.6, PAL.gold);
        }
        flash = Math.max(flash, 0.28);
      }
      if (sx < -180) { maw = null; } // despawn after pass
      else if (mode === 'playing') {
        // Collision with maw body (weave the gaps)
        const py = playerScreenY();
        const mProg = Math.max(0, Math.min(1, (W*0.26 - (W*0.18)) / (W*0.7) )); // approx relative
        const my = H*PLAY_TOP + (0.5 + Math.sin(maw.phase * 1.3) * 0.26) * H*(PLAY_BOT-PLAY_TOP);
        const mThick = 38 + Math.sin(maw.phase*2.1) * 9; // breathing
        const mHitX = W*0.26 + ((maw.x - worldX) / (W*0.9)) * (W*0.52);
        const distToMaw = Math.abs(mHitX - W*0.26);
        if (distToMaw < 48 && Math.abs(py - my) < mThick) {
          // hit the serpent body (no safe gap here)
          crash();
          return;
        }
        // near-miss juice on the body edges
        if (distToMaw < 72 && Math.abs(py - my) < mThick + 18) {
          flash = Math.max(flash, 0.07);
        }
      }
    }

    // Update particles
    for (let i=particles.length-1; i>=0; i--) {
      const p = particles[i];
      p.x += p.vx * (60*dt);
      p.y += p.vy * (60*dt);
      p.vy += 0.018; // light gravity on embers/debris
      p.life -= dt * (0.9 + (p.col === PAL.gold ? 0.3 : 0));
      p.sz *= 0.995;
      if (p.life <= 0.02) {
        particles.splice(i,1);
        partPool.push(p);
      }
    }

    // Decay FX
    shake = Math.max(0, shake * 0.86 - dt * 3);
    flash = Math.max(0, flash - dt * 1.6);
  }

  let floatTexts = [];
  function spawnFloatText(str, x, y, lifeMs) {
    floatTexts.push({ str, x, y, life: lifeMs/1000, vy: -0.6 });
    if (floatTexts.length > 6) floatTexts.shift();
  }
  function updateFloats(dt) {
    for (let i=floatTexts.length-1; i>=0; i--) {
      const f = floatTexts[i];
      f.y += f.vy;
      f.life -= dt;
      if (f.life <= 0) floatTexts.splice(i,1);
    }
  }

  // ============================================================
  // RENDER — Mythic weight, heat, ember trails, no placeholders
  // ============================================================
  function drawBackground(t) {
    // Deep heat void
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, PAL.bgDeep);
    g.addColorStop(0.42, PAL.bgHeat);
    g.addColorStop(1, '#0a0503');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Far ember field (slow parallax)
    ctx.fillStyle = 'rgba(255,120,50,0.35)';
    const far = ((worldX * 0.12) % 180) - 90;
    for (let i = -2; i < 6; i++) {
      for (let j = 0; j < 3; j++) {
        const ex = (i * 180 + far * 0.6) % (W + 120) - 60;
        const ey = 80 + j * 210 + Math.sin(t*0.4 + i + j) * 18;
        ctx.beginPath();
        ctx.arc(ex, ey, 1.2 + Math.sin(t*1.6 + i)*0.6, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // Mid heat haze bands (medium parallax)
    ctx.fillStyle = 'rgba(255,100,40,0.07)';
    const mid = ((worldX * 0.28) % 260);
    for (let k = 0; k < 5; k++) {
      const y = 60 + k * 140 + Math.sin(t*0.3 + k)*22;
      ctx.fillRect(0, y - 38, W, 76 + Math.sin(t*0.7 + k)*12);
    }

    // Subtle vignette + heat glow at horizon
    const vg = ctx.createRadialGradient(W*0.5, H*0.62, H*0.1, W*0.5, H*0.58, H*0.78);
    vg.addColorStop(0, 'transparent');
    vg.addColorStop(0.6, 'rgba(0,0,0,0.0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function drawDragon(px, py, t, boosting) {
    ctx.save();
    ctx.translate(px, py);

    const bob = Math.sin(t * 2.2) * 1.6 + Math.sin(t * 0.7) * 0.8;
    const lean = (playerVY * 18) * 0.6; // body follows velocity
    const wingPhase = boosting ? 1.6 : (0.8 + Math.sin(t * 3.8) * 0.6);
    const eyeGlow = boosting ? 0.95 : (0.55 + Math.sin(t * 4.2) * 0.25);

    // Tail flame (weight + presence)
    ctx.strokeStyle = PAL.ember;
    ctx.lineWidth = 2.5 * DPR;
    ctx.lineCap = 'round';
    ctx.shadowColor = PAL.ember;
    ctx.shadowBlur = boosting ? 18 : 9;
    for (let s = 0; s < 3; s++) {
      ctx.beginPath();
      const tx = -58 - s*11;
      const ty = bob * 0.6 + Math.sin(t*3.1 + s)* (3 + s);
      ctx.moveTo(-22, bob*0.3);
      ctx.quadraticCurveTo(tx*0.6, ty*0.4, tx, ty);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // Body segments (heavy, ancient)
    ctx.fillStyle = PAL.rock;
    ctx.strokeStyle = PAL.rockEdge;
    ctx.lineWidth = 1.5 * DPR;
    const segs = 5;
    let prevX = 0, prevY = bob;
    for (let s = 0; s < segs; s++) {
      const lag = (segs - s) * 0.22;
      const sx = -s * 17 + Math.sin(t*1.6 + s) * (1.2 + s*0.1);
      const sy = bob * (1 - s*0.12) + Math.sin(t*2.4 - s*0.6) * (2.5 - s*0.3) + lean * (s*0.08);
      ctx.beginPath();
      ctx.ellipse(sx, sy, 15 + (segs-s)*1.6, 9.5 - s*0.6, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();
      // scale glints (material weight)
      if (s % 2 === 0) {
        ctx.fillStyle = 'rgba(244,211,94,0.25)';
        ctx.beginPath();
        ctx.arc(sx - 3, sy - 3.5, 2.2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = PAL.rock;
      }
      // tether line to rider
      if (s === 1) {
        ctx.strokeStyle = 'rgba(200,161,122,0.35)';
        ctx.beginPath();
        ctx.moveTo(sx + 4, sy - 2);
        ctx.lineTo(12, -11 + bob*0.3);
        ctx.stroke();
        ctx.strokeStyle = PAL.rockEdge;
      }
      prevX = sx; prevY = sy;
    }

    // Neck + Head (presence, not cute)
    ctx.fillStyle = PAL.rock;
    ctx.beginPath();
    ctx.moveTo(6, bob*0.2);
    ctx.quadraticCurveTo(18, bob*0.1 - 6, 32, -4 + bob*0.1 + lean*0.2);
    ctx.quadraticCurveTo(38, -9 + bob*0.1, 44, -3 + bob*0.2);
    ctx.quadraticCurveTo(36, 4, 22, 5 + bob*0.15);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Jaw / horn weight
    ctx.beginPath();
    ctx.moveTo(32, -4 + bob*0.1);
    ctx.lineTo(48, -1 + bob*0.1);
    ctx.lineTo(43, 3 + bob*0.15);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Eye (consequence light)
    ctx.fillStyle = boosting ? PAL.gold : PAL.heat;
    ctx.beginPath();
    ctx.arc(38, -6 + bob*0.1, 2.8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(39, -7 + bob*0.1, 1.0, 0, Math.PI*2);
    ctx.fill();

    // Eye glow (temperature)
    const eg = ctx.createRadialGradient(38, -6 + bob*0.1, 1, 38, -6 + bob*0.1, 11);
    eg.addColorStop(0, `rgba(255,180,60,${0.35*eyeGlow})`);
    eg.addColorStop(1, 'transparent');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.arc(38, -6 + bob*0.1, 11, 0, Math.PI*2);
    ctx.fill();

    // Wings — large, weighty, respond to dash
    const wingSpread = 0.65 + wingPhase * 0.55;
    ctx.fillStyle = 'rgba(20,14,11,0.92)';
    ctx.strokeStyle = 'rgba(80,48,32,0.7)';
    ctx.lineWidth = 1.2 * DPR;
    // left (far)
    ctx.beginPath();
    ctx.moveTo(2, -2 + bob*0.3);
    ctx.quadraticCurveTo(-14, -26 * wingSpread + bob*0.4, -38, -11 + bob*0.6);
    ctx.quadraticCurveTo(-18, 2 + bob*0.5, 4, 6 + bob*0.2);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // right (near, more dramatic on boost)
    ctx.beginPath();
    ctx.moveTo(4, -1 + bob*0.2);
    ctx.quadraticCurveTo(12, -32 * wingSpread + bob*0.3, 42, -9 + (boosting ? -6 : 2) + bob*0.4);
    ctx.quadraticCurveTo(18, 4 + bob*0.3, 6, 7 + bob*0.15);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Wing membrane heat lines
    ctx.strokeStyle = boosting ? 'rgba(255,140,50,0.45)' : 'rgba(255,120,40,0.22)';
    ctx.lineWidth = 1 * DPR;
    ctx.beginPath();
    ctx.moveTo(8, -8 + bob*0.3);
    ctx.quadraticCurveTo(18, -20 * wingSpread, 34, -6);
    ctx.stroke();

    // Rider (human witness, humble scale)
    ctx.fillStyle = PAL.rider;
    ctx.beginPath();
    ctx.arc(11, -12 + bob*0.25, 3.5, 0, Math.PI*2); // helm
    ctx.fill();
    ctx.fillStyle = '#2a211c';
    ctx.fillRect(8, -7 + bob*0.2, 7, 9); // torso
    // arm reaching on rescue/collect feel (subtle)
    if (combo > 3) {
      ctx.strokeStyle = PAL.rider;
      ctx.lineWidth = 1.5 * DPR;
      ctx.beginPath();
      ctx.moveTo(14, -3 + bob*0.2);
      ctx.lineTo(22, -7 + bob*0.1);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawHazard(hz, t) {
    const sx = (hz.x - worldX) / (W * 0.9) * (W * 0.5) + W * 0.26;
    const sy = H * PLAY_TOP + hz.y * H * (PLAY_BOT - PLAY_TOP);
    const hh = hz.h * H * 0.92;

    ctx.save();
    ctx.translate(sx, sy);

    if (hz.kind === 'spire') {
      // Tall rock with flame crown
      ctx.fillStyle = PAL.rock;
      ctx.beginPath();
      ctx.moveTo(-11, -hh*0.5);
      ctx.lineTo(-7, hh*0.5);
      ctx.lineTo(7, hh*0.5);
      ctx.lineTo(11, -hh*0.5);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = PAL.rockEdge;
      ctx.lineWidth = 1.5 * DPR;
      ctx.stroke();

      // Flame crown (flickering, hungry)
      const f = Math.sin(t*4.2 + hz.phase)*0.5 + 0.5;
      const grad = ctx.createLinearGradient(0, -hh*0.55, 0, -hh*0.9 - f*8);
      grad.addColorStop(0, PAL.ember);
      grad.addColorStop(0.4, PAL.heat);
      grad.addColorStop(1, 'rgba(255,200,60,0.1)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-6, -hh*0.52);
      ctx.quadraticCurveTo(-4 - f*3, -hh*0.72 - f*6, 0, -hh*0.92 - f*9);
      ctx.quadraticCurveTo(5 + f*2, -hh*0.7 - f*5, 7, -hh*0.52);
      ctx.closePath();
      ctx.fill();
    } else {
      // Vent — low wide heat vent
      ctx.fillStyle = PAL.rock;
      ctx.fillRect(-22, -4, 44, 9);
      ctx.strokeStyle = PAL.rockEdge;
      ctx.strokeRect(-22, -4, 44, 9);
      // Erupting heat
      const f = (Math.sin(t*5.8 + hz.phase) * 0.5 + 0.5);
      ctx.fillStyle = `rgba(255,90,31,${0.35 + f*0.25})`;
      ctx.beginPath();
      ctx.ellipse(0, -8 - f*7, 13 + f*4, 4 + f*2, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawEmber(e, t) {
    const sx = (e.x - worldX) / (W * 0.9) * (W * 0.5) + W * 0.26;
    const sy = H * PLAY_TOP + e.y * H * (PLAY_BOT - PLAY_TOP);
    const r = 3.2 + Math.sin(t*3.6 + e.x)*0.6;
    // Core
    ctx.fillStyle = PAL.gold;
    ctx.beginPath();
    ctx.arc(sx, sy, r*0.6, 0, Math.PI*2);
    ctx.fill();
    // Glow
    const eg = ctx.createRadialGradient(sx, sy, 1, sx, sy, r*2.8);
    eg.addColorStop(0, 'rgba(255,200,80,0.55)');
    eg.addColorStop(1, 'transparent');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.arc(sx, sy, r*2.8, 0, Math.PI*2);
    ctx.fill();
  }

  function drawGraze(g, t) {
    const sx = (g.x - worldX) / (W * 0.9) * (W * 0.5) + W * 0.26;
    const sy = H * PLAY_TOP + g.y * H * (PLAY_BOT - PLAY_TOP);
    // Small witness silhouette (humble)
    ctx.fillStyle = 'rgba(200,161,122,0.85)';
    ctx.beginPath();
    ctx.arc(sx, sy - 2, 2.8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(sx-2.5, sy+1, 5, 5.5);
    // Rescue ring (faint)
    ctx.strokeStyle = 'rgba(244,211,94,0.4)';
    ctx.lineWidth = 1.2 * DPR;
    ctx.beginPath();
    ctx.arc(sx, sy, 11 + Math.sin(t*4.4)*1.5, 0, Math.PI*2);
    ctx.stroke();
  }

  function drawMaw(m, t) {
    const sx = (m.x - worldX) / (W * 0.9) * (W * 0.5) + W * 0.26;
    // Large undulating flame serpent body (weighty, mythic, not cartoon)
    ctx.save();
    const myBase = H * PLAY_TOP + (0.5 + Math.sin(m.phase * 1.3) * 0.26) * H * (PLAY_BOT - PLAY_TOP);
    ctx.translate(sx, myBase);

    // Body segments (segmented like dragon, but hostile fire)
    ctx.strokeStyle = 'rgba(40,18,12,0.95)';
    ctx.lineWidth = 22 * DPR;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (let s = -2; s <= 3; s++) {
      const sy = Math.sin(m.phase * 1.7 + s * 1.15) * 31;
      const ex = s * 19;
      ctx.beginPath();
      ctx.moveTo(ex - 18, sy * 0.6);
      ctx.lineTo(ex + 22, sy);
      ctx.stroke();
    }

    // Heat core + edges (hungry fire)
    ctx.strokeStyle = PAL.ember;
    ctx.lineWidth = 9 * DPR;
    ctx.shadowColor = PAL.ember;
    ctx.shadowBlur = 16;
    for (let s = -2; s <= 3; s++) {
      const sy = Math.sin(m.phase * 1.7 + s * 1.15) * 31;
      const ex = s * 19;
      ctx.beginPath();
      ctx.moveTo(ex - 18, sy * 0.6);
      ctx.lineTo(ex + 22, sy);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // Bright inner vents (the gaps player must read)
    ctx.strokeStyle = 'rgba(255,210,120,0.9)';
    ctx.lineWidth = 3.5 * DPR;
    for (let s = -1; s <= 2; s++) {
      const sy = Math.sin(m.phase * 1.7 + s * 1.15) * 31;
      const ex = s * 19;
      const gape = 1.0 + Math.sin(m.phase * 2.6 + s) * 0.6;
      ctx.beginPath();
      ctx.moveTo(ex - 7, sy * 0.5 - 5 * gape);
      ctx.lineTo(ex + 11, sy - 6 * gape);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ex - 7, sy * 0.5 + 5 * gape);
      ctx.lineTo(ex + 11, sy + 6 * gape);
      ctx.stroke();
    }

    // Maw head (front, more solid)
    ctx.fillStyle = 'rgba(30,14,10,0.98)';
    ctx.beginPath();
    ctx.ellipse(58, Math.sin(m.phase*2.1)*7, 26, 19, 0.2, 0, Math.PI*2);
    ctx.fill();
    // Head flame crown
    ctx.fillStyle = PAL.flame;
    ctx.beginPath();
    ctx.ellipse(66, Math.sin(m.phase*2.1)*4 - 3, 11, 7, 0.1, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function drawParticles() {
    for (let i=0; i<particles.length; i++) {
      const p = particles[i];
      const a = Math.max(0.08, p.life * 0.9);
      ctx.fillStyle = p.col === PAL.gold ? `rgba(244,211,94,${a})` : `rgba(255,90,31,${a})`;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillRect(-p.sz*0.5, -p.sz*0.5, p.sz, p.sz*0.7);
      ctx.restore();
    }
  }

  function drawHUD() {
    // distance
    document.getElementById('dist').textContent = Math.floor(distance).toString().padStart(3,'0');
    document.getElementById('embers').textContent = embers.toString().padStart(2,'0');
    const cEl = document.getElementById('combo-val');
    cEl.textContent = '×' + Math.floor(combo);
    cEl.style.color = combo > 4 ? PAL.ember : (combo > 2 ? PAL.heat : 'inherit');

    // boost bar
    const b = Math.max(0.04, Math.min(1, boost));
    document.getElementById('boost-bar').style.width = (b * 100) + '%';
    document.getElementById('boost-bar').style.background = (time < boostUntil)
      ? 'linear-gradient(90deg,#fff,#f4d35e)'
      : 'linear-gradient(90deg,#ff5a1f,#f4d35e)';

    // status line (subtle escalation hint after distance)
    const st = document.getElementById('status');
    if (maw) st.textContent = 'SKY MAW • WEAVE THE GAPS';
    else if (distance > 820) st.textContent = 'THROUGH THE MAW • LAST CHAIN';
    else if (distance > 620) st.textContent = 'THE MAW OPENS • DASH THE GAP';
    else if (distance > 320) st.textContent = 'FEEL THE HEAT • CHAIN THE DASH';
    else st.textContent = 'WEAVE • DASH • CHAIN';
  }

  function drawFloats() {
    ctx.save();
    ctx.font = (13 * DPR) + 'px system-ui, sans-serif';
    ctx.textAlign = 'left';
    for (let i=0; i<floatTexts.length; i++) {
      const f = floatTexts[i];
      const a = Math.max(0.15, f.life / 0.9);
      ctx.fillStyle = `rgba(244,211,94,${a})`;
      ctx.fillText(f.str, f.x, f.y);
    }
    ctx.restore();
  }

  function render(t) {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.floor(W * DPR) || canvas.height !== Math.floor(H * DPR)) {
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0.016;
    lastT = t;
    time += dt;

    // Sim
    updateInput(dt);
    updateWorld(dt);
    updateFloats(dt);
    updateAudio(dt);

    const boosting = time < boostUntil;

    // Camera shake
    const sx = (Math.random() - 0.5) * shake;
    const sy = (Math.random() - 0.5) * shake * 0.6;

    ctx.save();
    ctx.translate(sx, sy);

    // Background layers
    drawBackground(time);

    // Near foreground rock shards (fast parallax, speed feel)
    ctx.fillStyle = 'rgba(18,10,8,0.75)';
    const fgOff = (worldX * 0.9) % 140;
    for (let i=-1; i<5; i++) {
      const x = ((i*140 - fgOff) % (W+80)) - 40;
      const y = H*0.78 + Math.sin(i)*6;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x+18, y+26);
      ctx.lineTo(x+32, y-2);
      ctx.fill();
    }

    // Boost speed lines (kinetic juice, only when surging)
    if (boosting) {
      ctx.strokeStyle = 'rgba(255,200,80,0.18)';
      ctx.lineWidth = 1 * DPR;
      for (let s=0; s<5; s++) {
        const ly = 80 + ((time * 180 + s*47) % (H-160));
        ctx.beginPath();
        ctx.moveTo(W*0.08, ly);
        ctx.lineTo(W*0.24, ly + (Math.sin(time*3+s)*3));
        ctx.stroke();
      }
    }

    // Entities (back to front)
    for (const hz of hazards) drawHazard(hz, time);
    for (const e of embersArr) drawEmber(e, time);
    for (const g of grazes) drawGraze(g, time);
    if (maw) drawMaw(maw, time);

    // Player dragon (heroic weight)
    const px = W * 0.26;
    const py = playerScreenY();
    drawDragon(px, py, time, boosting);

    // Player ember wake (kinetic)
    if (mode === 'playing') {
      const wakeCol = boosting ? PAL.gold : PAL.ember;
      for (let i=0; i<3; i++) {
        spawnParticle(px - 32 - i*7, py + (i-1)*3 + Math.sin(time*7+i)*1.5,
          -1.2 - Math.random()*0.8, (Math.random()-0.5)*0.7,
          0.22 + Math.random()*0.12, 1.1 + Math.random()*0.6, wakeCol);
      }
    }

    drawParticles();

    // Heat flash overlay (consequence)
    if (flash > 0.01) {
      ctx.fillStyle = `rgba(255,120,40,${flash * 0.22})`;
      ctx.fillRect(0, 0, W, H);
    }

    // Subtle vignette edges for mythic focus
    const vg2 = ctx.createRadialGradient(W*0.5, H*0.5, Math.min(W,H)*0.32, W*0.5, H*0.5, Math.max(W,H)*0.72);
    vg2.addColorStop(0, 'transparent');
    vg2.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = vg2;
    ctx.fillRect(0, 0, W, H);

    ctx.restore();

    drawFloats();
    drawHUD();

    // Ready prompt pulse
    const promptEl = document.getElementById('prompt');
    if (mode === 'ready') {
      promptEl.style.opacity = 0.6 + Math.sin(time * 2.8) * 0.25;
    }

    // Crash flash linger
    if (mode === 'crashed' && flash > 0.1) {
      ctx.fillStyle = `rgba(255,70,20,${flash * 0.12})`;
      ctx.fillRect(0, 0, W, H);
    }

    // Verification hook
    if (window.__emberflightGauntlet) {
      window.__emberflightGauntlet.lastState = { mode, embers, combo: Math.floor(combo), distance: Math.floor(distance), boosting, first: firstInteraction, maw: !!maw };
    }

    requestAnimationFrame(render);
  }

  // ============================================================
  // BOOT
  // ============================================================
  function resize() {
    W = Math.max(960, Math.min(1680, window.innerWidth));
    H = Math.max(620, Math.min(980, window.innerHeight));
    // keep DPR handled in render
  }

  function boot() {
    initPools();
    resize();
    window.addEventListener('resize', () => {
      resize();
    });

    // Expose for verification (in-game state after interaction)
    window.__emberflightGauntlet = {
      getState: () => ({ mode, embers, combo: Math.floor(combo), distance: Math.floor(distance), firstInteraction, maw: !!maw }),
      forceDash: () => { if (mode==='playing') dashRequested = true; },
      forceRestart: () => restart()
    };

    bindInput();

    // Seed a tiny idle atmosphere (embers drifting) so first frame feels alive but not playing
    for (let i=0; i<5; i++) {
      embersArr.push({ x: 300 + i*170, y: 0.3 + Math.random()*0.42, vy: (Math.random()-0.5)*0.01 });
    }
    hazards.push({ x: 820, y: 0.38, kind:'spire', h:0.10, phase:1.2 });
    hazards.push({ x: 1180, y: 0.71, kind:'vent', h:0.08, phase:0.4 });

    // Gentle idle sway for dragon in ready
    playerY = 0.48;

    // Start render immediately (first screen = playable game)
    lastT = performance.now();
    requestAnimationFrame(render);

    // Subtle ready state: no audio, no motion until gesture
    // (per checklist: audio only after user gesture)
  }

  // Keyboard hint for restart also works globally in crashed
  window.addEventListener('keydown', (e) => {
    if ((mode === 'crashed' || mode === 'ready') && (e.key.toLowerCase() === 'r')) {
      e.preventDefault();
      restart();
    }
  });

  // Touch large-target restart
  document.getElementById('restart-btn').addEventListener('click', (e) => {
    e.preventDefault();
    restart();
  });

  boot();
  </script>
</body>
</html>
