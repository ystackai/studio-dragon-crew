<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Emberflight Gauntlet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0c0705;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #mute {
      position: absolute; top: 12px; right: 14px; z-index: 10;
      font: 13px/1 monospace; color: #ffcc88; background: rgba(20,10,6,0.6);
      border: 1px solid #664422; padding: 4px 8px; border-radius: 4px; cursor: pointer;
      user-select: none; touch-action: manipulation;
    }
    #mute:hover { background: rgba(40,18,8,0.75); }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="mute" title="Toggle audio (starts after first gesture)">🔊</div>
  <script src="input.js"></script>
  <script src="dragon.js"></script>
  <script src="game.js"></script>
</body>
</html>
