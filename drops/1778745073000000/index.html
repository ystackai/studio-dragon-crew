<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dragon Sanctuary – The Dragon Crew</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080a12;font-family:system-ui,sans-serif;color:#eae2da}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
#overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,18,0.94);transition:opacity .9s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(1.8rem,4.5vw,3.4rem);font-weight:200;letter-spacing:.1em;background:linear-gradient(135deg,#f0d0b0,#72b6cb,#c8a8e0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
#overlay p{color:rgba(234,226,218,.5);font-size:.88rem;max-width:400px;text-align:center;line-height:1.55;margin-bottom:20px}
#start-btn{padding:14px 38px;border:1px solid rgba(234,226,218,.18);border-radius:28px;background:rgba(234,226,218,.06);color:#eae2da;font-size:1rem;cursor:pointer;transition:all .3s}
#start-btn:hover{background:rgba(234,226,218,.14);border-color:rgba(234,226,218,.35)}
#hud{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.dtag{font-size:.65rem;padding:3px 10px;border-radius:14px;border:1px solid rgba(234,226,218,.08);background:rgba(8,10,18,.6);opacity:.45;transition:all .4s}
.dtag.active{opacity:1;border-color:rgba(234,226,218,.28);box-shadow:0 0 8px rgba(234,226,218,.12)}
.dtag.lit{opacity:1;border-color:#f0d0b0;box-shadow:0 0 16px rgba(240,208,176,.3)}
#info{position:fixed;top:10px;right:12px;z-index:5;font-size:.62rem;color:rgba(234,226,218,.28);text-align:right;line-height:1.5;pointer-events:none}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;font-size:1.3rem;color:#eae2da;opacity:0;transition:opacity 1.2s;pointer-events:none;text-shadow:0 0 28px rgba(234,226,218,.3)}
#msg.show{opacity:1}
#breath-ring{position:fixed;pointer-events:none;border:1px solid rgba(234,226,218,.15);border-radius:50%;background:transparent;transition:opacity .3s;z-index:3}
#bloom-overlay{position:fixed;inset:0;pointer-events:none;z-index:2;background:transparent;transition:background 1.5s}
@media (prefers-reduced-motion:reduce){.dtag,#overlay,#msg{transition:none}.dtag.active{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bloom-overlay"></div>
<div id="overlay">
  <h1>✦ Dragon Sanctuary ✦</h1>
  <p>Six elemental dragons drift through a magical realm. Click a dragon to hear its song. Drag to stir the breeze and redirect its drift. Hold to deepen the breath and bloom the sanctuary. Keyboard shortcuts: keys 1–6.</p>
  <button id="start-btn">Enter the Sanctuary</button>
</div>
<div id="hud"></div>
<div id="info"><div id="fps-label">FPS: --</div><div id="breath-label">Breath: --</div></div>
<div id="msg"></div>
<div id="breath-ring"></div>
<script>
"use strict";
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Dragon Sanctuary – The Dragon Crew
// WebGL2 interactive experience with 6 elemental dragons
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// ─── DRAGON DEFINITIONS ───
const DRAGONS = [
  { id:'water',  name:'Water Dragon',  hue:0.55,  freq:146.83,  desc:'Graceful river light, translucent blue-green scales' },
  { id:'sea',    name:'Sea Dragon',    hue:0.48,  freq:130.81,  desc:'Pearl and teal tones, coastal air, open horizon' },
  { id:'ice',    name:'Ice Dragon',    hue:0.62,  freq:174.61,  desc:'Crystalline frost detail, polished blue-white scales' },
  { id:'snow',   name:'Snow Dragon',   hue:0.70,  freq:196.00,  desc:'Soft white texture, feathery accents, gentle presence' },
  { id:'fire',   name:'Fire Dragon',   hue:0.08,  freq:207.65,  desc:'Heroic golden-hour warmth, copper and amber scales' },
  { id:'lava',   name:'Lava Dragon',   hue:0.02,  freq:220.00,  desc:'Obsidian structure, molten seams, blue-hour contrast' },
];

// ─── HSL→RGB ───
function hsl2rgb(h,s,l){
  h=((h%1)+1)%1;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1+Math.abs((h+n/3)%1*6-4),Math.min(1,-1+Math.abs((h+n/3)%1*6-4)));
  return [f(0),f(1),f(2)];
}

// ─── RENDER SETUP ───
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:true,alpha:false});
if(!gl)throw'WebGL2 required';

// ─── SHADERS ───
const VS=`#version 300 es
layout(location=0)in vec2 P;layout(location=1)in vec2 T;
uniform vec2 uR,uO;uniform float uT,uW,uD;
out vec2 vT;out float vH;
void main(){
  vec2 p=P;float t=uT;
  float wob=sin(t*1.7+uO.x*3.1)*.015+cos(t*1.3+uO.y*2.9)*.015;
  p.x+=sin(p.y*3.14+uO.x*2.1+t)*.03+wob;
  p.y+=cos(p.x*3.14+uO.y*1.9+t)*.025+wob*0.7;
  gl_Position=vec4(p*uW+uO*uR,0,1);vT=T;vH=p.y;
}`;

const FS=`#version 300 es
precision highp float;
in vec2 vT;in float vH;
uniform vec3 uC,uG;uniform float uS,uL,uT,uD;
out vec4 oF;
void main(){
  float d=length(vT-0.5);
  float a=1.-smoothstep(0.,0.45,d);
  float r=sin(vT.x*20.+vT.y*20.+uT)*.25+.75;
  float g=sin(vT.x*22.+vT.y*20.+uT*1.1+2.1)*.25+.75;
  float b=sin(vT.x*24.+vT.y*20.+uT*1.2+4.3)*.25+.75;
  vec3 col=mix(uC,vec3(1),.15)*vec3(r,g,b);
  float glow=exp(-d*5.)*uL*.35;
  col+=uG*glow;
  col+=vec3(1)*exp(-d*8.)*uL*.08;
  float ring=abs(0.35-length(vT-0.5));
  col+=uG*smoothstep(.03,.0,ring)*uL*.25;
  float edge=a*(1.-abs(vT.x-.5)*3.);
  oF=vec4(col,edge*.88);
}`;

function compile(t,s){
  const c=gl.createShader(t);gl.shaderSource(c,s);gl.compileShader(c);
  if(!gl.getShaderParameter(c,gl.COMPILE_STATUS))throw'Shader: '+gl.getShaderInfoLog(c);
  return c;
}
function link(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw'Program';
  return p;
}
const prog=link(VS,FS);
const uR=gl.getUniformLocation(prog,'uR'),uO=gl.getUniformLocation(prog,'uO');
const uT=gl.getUniformLocation(prog,'uT'),uW=gl.getUniformLocation(prog,'uW');
const uC=gl.getUniformLocation(prog,'uC'),uG=gl.getUniformLocation(prog,'uG');
const uL=gl.getUniformLocation(prog,'uL'),uS=gl.getUniformLocation(prog,'uS');
const uD=gl.getUniformLocation(prog,'uD');

// ─── GEOMETRY ───
function circle(n){
  const N=(n+2)*2;const verts=new Float32Array(N*4);
  verts[0]=0;verts[1]=0;verts[2]=.5;verts[3]=.5;
  for(let j=0;j<=n;j++){
    const a=j/n*6.2832;
    const ca=Math.cos(a)*.5,sa=Math.sin(a)*.5;
    const k=(j+1)*4;
    verts[k]=ca;verts[k+1]=sa;verts[k+2]=.5+ca;verts[k+3]=.5+sa;
  }
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,verts,gl.STATIC_DRAW);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,16,0);
  gl.vertexAttribPointer(1,2,gl.FLOAT,false,16,8);
  gl.enableVertexAttribArray(0);gl.enableVertexAttribArray(1);
  const idx=new Uint16Array(n*3);
  for(let j=0;j<n;j++){idx[j*3]=0;idx[j*3+1]=j+1;idx[j*3+2]=j+2;}
  const ib=gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
  return n*3;
}
const CIRC=circle(36);

// ─── BACKGROUND SHADER ───
const BGV=`#version 300 es
layout(location=0)in vec2 P;
out vec2 vU;
void main(){vU=P*.5+.5;gl_Position=vec4(P,0,1);}`;

const BGF=`#version 300 es
precision highp float;
in vec2 vU;uniform float uT,uD;
out vec4 oF;
float n2(vec2 p,float t){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=fract(sin(dot(i,vec2(127.1,311.7))+t)*43758.5);float b=fract(sin(dot(i+vec2(1,0),vec2(127.1,311.7))+t)*43758.5);float c=fract(sin(dot(i+vec2(0,1),vec2(127.1,311.7))+t)*43758.5);float d=fract(sin(dot(i+vec2(1,1),vec2(127.1,311.7))+t)*43758.5);return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
void main(){
  vec2 uv=vU*.8;float t=uT*.06;
  float n1=n2(uv*2.1,t);float n2=n2(uv*3.2+1.2,t*1.1);
  vec3 col=mix(vec3(.02,.03,.05),vec3(.06,.04,.1),n1);
  col=mix(col,vec3(.15,.06,.02),n2*.3);
  float stars=0.;
  for(int i=0;i<3;i++){
    vec2 sp=vec2(fract(sin(float(i)*37.7+12.9)*43758.5),fract(sin(float(i)*73.1+47.3)*43758.5));
    vec2 sv=uv*8.+sp;float sd=length(sv);
    stars+=exp(-sd*80.);
  }
  col+=vec3(1)*stars*.03;
  float vig=1.-length(vU-.5)*1.1;
  col*=vig;
  oF=vec4(col,1);
}`;
const bgProg=link(BGV,BGF);
const uBgT=gl.getUniformLocation(bgProg,'uT'),uBgD=gl.getUniformLocation(bgProg,'uD');

// Full-screen quad
const fsq=new Float32Array([-1,-1,1,-1,-1,1,1,1]);
const fsqBuf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,fsqBuf);
gl.bufferData(gl.ARRAY_BUFFER,fsq,gl.STATIC_DRAW);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.enableVertexAttribArray(0);

// ─── PARTICLES ───
class X{
  constructor(x,y,c){this.x=x;this.y=y;this.vx=(Math.random()-.5)*.025;this.vy=(Math.random()-.5)*.025;this.l=1;this.m=40+Math.random()*30;this.c=c;this.s=2+Math.random()*3;}
  up(t,wind){this.x+=this.vx+wind.x*.003;this.y+=this.vy+wind.y*.003;this.vx+=Math.cos(this.y*15+t)*.0003;this.vy+=Math.sin(this.x*15+t)*.0003;this.l=Math.max(0,this.l-1/this.m);}
}
class PS{
  constructor(){this.p=[];this.m=400;}
  emit(x,y,c,n){for(let i=0;i<n;i++)this.p.push(new X(x,y,c));if(this.p.length>this.m)this.p=this.p.slice(-this.m);}
  up(t,wind){for(const p of this.p)p.up(t,wind);this.p=this.p.filter(p=>p.l>0);}
}

// ─── DRAGON ───
class D{
  constructor(d,i){
    const c=hsl2rgb(d.hue,.7,.55),g=hsl2rgb(d.hue,.9,.8);
    this.c=c;this.g=g;this.f=d.freq;this.id=d.id;this.i=i;this.n=d.name;
    this.x=(Math.random()-.5)*1.5;this.y=(Math.random()-.5)*1.5;
    this.tx=this.x;this.ty=this.y;
    this.sz=.16+Math.random()*.04;
    this.ph=Math.random()*6.28;this.sp=.1+Math.random()*.08;
    this.b=0;this.gi=0;this.ang=0;this.pu=0;
    this.dragged=false;this.lastHit=0;
  }
  up(t){
    if(!this.dragged){
      this.x+=((this.tx-this.x)*.006+Math.sin(t*this.sp+this.ph)*.003);
      this.y+=((this.ty-this.y)*.006+Math.cos(t*this.sp*1.1+this.ph*1.3)*.003);
      if(Math.random()<.002){this.tx=(Math.random()-.5)*1.5;this.ty=(Math.random()-.5)*1.5;}
    }
    if(this.b>0){this.b-=.012;this.gi=this.b;}else this.gi*=.95;
    this.ang+=.003;this.pu=.5+Math.sin(t*2+this.ph)*.5;
  }
  hit(ar){this.b=1;this.gi=1;this.lastHit=t;ps.emit(this.x*ar,this.y,this.c,20);}
  getActivity(){return Date.now()-this.lastHit*1000<3000?this.gi:0;}
}
const dragons=DRAGONS.map((d,i)=>new D(d,i));
const ps=new PS();
let t=0,audio=null,started=false;
const ov=document.getElementById('overlay'),btn=document.getElementById('start-btn');
const msg=document.getElementById('msg'),fps=document.getElementById('fps-label');
const breathLabel=document.getElementById('breath-label');
const hud=document.getElementById('hud');
const breathRing=document.getElementById('breath-ring');
const bloomEl=document.getElementById('bloom-overlay');

// HUD
for(const d of DRAGONS){
  const e=document.createElement('span');e.className='dtag';e.id='t-'+d.id;
  e.textContent=d.name.split(' ')[0];hud.appendChild(e);
}

// RESIZE
function resize(){
  const W=canvas.clientWidth*dp();const H=canvas.clientHeight*dp();
  if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;gl.viewport(0,0,W,H);}
  const a=W/H;gl.uniform2f(uR,a>1?[1,1/a]:[a,1]);
}
function dp(){return devicePixelRatio||1}
window.addEventListener('resize',resize);resize();

btn.addEventListener('click',()=>{
  ov.classList.add('hidden');setTimeout(()=>ov.style.display='none',900);
  if(!started){audio=new(window.AudioContext||window.webkitAudioContext)();started=true;initAudio(audio);}
});

// ─── INTERACTION ───
let dragDragon=null,dragActive=false,holdTime=0;
let mouseX=0,mouseY=0;

canvas.addEventListener('pointerdown',e=>{
  if(!started)return;
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*2-1;
  const y=-(e.clientY-r.top)/r.height*2+1;
  const a=canvas.width/canvas.height;const cx=x/a,cy=y;
  mouseX=x;mouseY=y;
  let close=null,md=.28;
  for(const d of dragons){
    const dx=cx-d.x,dy=cy-d.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<md){md=dist;close=d;}
  }
  if(close){
    dragDragon=close;
    dragActive=true;
    holdTime=0;
    close.dragged=true;
    close.hit(a);
    playNote(audio,close.f);
    showMsg(close.n+' awakens ✦');
    updateBloom();
    updateHUD();
  }
});

canvas.addEventListener('pointermove',e=>{
  if(!started)return;
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*2-1;
  const y=-(e.clientY-r.top)/r.height*2+1;
  const a=canvas.width/canvas.height;const cx=x/a,cy=y;
  mouseX=x;mouseY=y;

  if(dragActive&&dragDragon){
    dragDragon.x=cx;
    dragDragon.y=cy;
    holdTime+=.016;
    if(holdTime>2){
      dragDragon.b=Math.min(1,dragDragon.b+.015);
      dragDragon.gi=dragDragon.b;
      ps.emit(dragDragon.x*a,dragDragon.y,dragDragon.c,2);
      breathLabel.textContent='Breath: '+Math.round(dragDragon.b*100)+'%';
    }
    if(Math.random()<.3)ps.emit(dragDragon.x*a,dragDragon.y,dragDragon.c,2);
  }
});

canvas.addEventListener('pointerup',e=>{
  if(!dragActive||!dragDragon)return;
  dragDragon.dragged=false;
  dragActive=false;
  document.querySelectorAll('.dtag').forEach(el=>el.classList.remove('active'));
  const msg=Math.round(dragDragon.b*100);
  if(msg>50)showMsg(dragDragon.n+' breathes deeply ('+msg+'%)');
  dragDragon=null;holdTime=0;
  updateHUD();
});

canvas.addEventListener('pointerleave',()=>{
  if(dragDragon)dragDragon.dragged=false;
  dragActive=false;dragDragon=null;holdTime=0;
  document.querySelectorAll('.dtag').forEach(el=>el.classList.remove('active'));
});

// Keyboard interaction
document.addEventListener('keydown',e=>{
  if(!started)return;
  if(e.key>='1'&&e.key<='6'){
    const i=parseInt(e.key)-1;
    if(dragons[i]){
      dragons[i].hit(canvas.width/canvas.height);
      playNote(audio,dragons[i].f);
      showMsg(dragons[i].n+' responds ✦');
      updateBloom();
      updateHUD();
    }
  }
});

// ─── AUDIO ───
function initAudio(ctx){
  const m=ctx.createGain();m.gain.value=.25;m.connect(ctx.destination);
  const r=ctx.createConvolver();
  const rate=ctx.sampleRate;const len=rate*2.5;
  const b=ctx.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);}
  r.buffer=b;
  const wet=ctx.createGain();wet.gain.value=.22;
  const dry=ctx.createGain();dry.gain.value=.5;
  m.connect(dry);dry.connect(ctx.destination);
  m.connect(wet);wet.connect(r);r.connect(ctx.destination);
  for(const f of[55,65.41,73.42,82.41,98]){
    const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;
    const g=ctx.createGain();g.gain.value=.03;
    o.connect(g);g.connect(wet);o.start();
  }
  const lfo=ctx.createOscillator();lfo.type='sine';lfo.frequency.value=.15;
  const lfoG=ctx.createGain();lfoG.gain.value=.15;
  lfo.connect(lfoG);lfoG.connect(wet.gain);
  lfo.start();
}
let ln=0;
function playNote(ctx,f){
  const n=performance.now();
  if(n-ln<150)return;ln=n;
  const o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;
  const g=ctx.createGain();g.gain.value=.1;
  const e=ctx.createGain();e.gain.setValueAtTime(.3,ctx.currentTime);
  e.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+2);
  o.connect(g);g.connect(e);e.connect(ctx.destination);
  o.start();o.stop(ctx.currentTime+2);
  const o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=f*2;
  const g2=ctx.createGain();g2.gain.value=.04;
  const e2=ctx.createGain();e2.gain.setValueAtTime(.25,ctx.currentTime);
  e2.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+3);
  o2.connect(g2);g2.connect(e2);e2.connect(ctx.destination);
  o2.start();o2.stop(ctx.currentTime+3);
}

function showMsg(txt){msg.textContent=txt;msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),1400);}

// ─── BLOOM EFFECT ───
function updateBloom(){
  // Count recently active dragons
  let active=0;
  for(const d of dragons)if(d.lastHit>t-5)active++;
  if(active>=3){
    bloomEl.style.background='radial-gradient(circle at 50% 50%, rgba(240,208,176,0.06), transparent 70%)';
    setTimeout(()=>bloomEl.style.background='transparent',2000);
  }
}
function updateHUD(){
  document.querySelectorAll('.dtag').forEach(el=>el.classList.remove('active'));
  if(dragDragon){
    document.getElementById('t-'+dragDragon.id)?.classList.add('active');
  }
}

// ─── RENDER ───
let fr=0,ft=0,windPhase=0;
function render(time){
  t=time/1000;resize();
  const ar=canvas.width/canvas.height;

  // Background nebula
  gl.useProgram(bgProg);
  gl.uniform1f(uBgT,t);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  // Sanctuary render
  gl.useProgram(prog);
  gl.uniform1f(uT,t);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);

  windPhase+=.003;
  const wind={x:Math.sin(windPhase)*.4,y:Math.cos(windPhase*1.3)*.3};

  ps.up(t,wind);

  for(const d of dragons){
    d.up(t);
    gl.uniform2f(uO,d.x,d.y);
    gl.uniform1f(uW,d.sz);
    gl.uniform1f(uL,Math.max(.25,d.gi));
    gl.uniform3fv(uC,d.c);gl.uniform3fv(uG,d.g);
    gl.drawElements(gl.TRIANGLES,CIRC,gl.UNSIGNED_SHORT,0);
  }

  gl.uniform1f(uL,.55);
  gl.uniform3f(uG,.6,.8,1);
  for(const p of ps.p){
    gl.uniform2f(uO,p.x,p.y);
    gl.uniform1f(uW,p.s*.012);
    gl.uniform3fv(uC,p.c);
    gl.drawElements(gl.TRIANGLES,CIRC,gl.UNSIGNED_SHORT,0);
  }

  fr++;
  if(t-ft>=1){fps.textContent='FPS: '+fr;fr=0;ft=t;}
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
