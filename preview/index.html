<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=drops/dragonbound-depths/index.html">
  <title>Dragonbound Depths — The Dragon Crew</title>
  <style>
    :root {
      --bg: #08131b;
      --panel: rgba(9, 24, 35, 0.8);
      --line: rgba(151, 195, 220, 0.2);
      --text: #eef7fb;
      --muted: #9eb6c3;
      --accent: #62b6cb;
      --accent-warm: #ff9f5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(98, 182, 203, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255, 159, 90, 0.16), transparent 30%),
        linear-gradient(160deg, #071019 0%, #0d1d28 48%, #1d1110 100%);
      min-height: 100vh;
    }
    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.2rem, 4vw, 4rem);
      line-height: 1;
      letter-spacing: 0.03em;
    }
    .intro {
      color: var(--muted);
      max-width: 760px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .note {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.24);
    }
    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: linear-gradient(135deg, rgba(98, 182, 203, 0.2), rgba(255, 159, 90, 0.14));
    }
    .copy {
      padding: 18px 18px 20px;
    }
    .eyebrow {
      display: inline-block;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }
    .warm { color: var(--accent-warm); }
  </style>
</head>
<body>
  <main style="padding-top: 120px; text-align: center;">
    <h1 style="font-size: 2.4rem; margin-bottom: 8px;">Dragonbound Depths</h1>
    <p style="color: #9eb6c3; max-width: 520px; margin: 0 auto 24px; line-height: 1.5;">
      Co-op fantasy action RPG vertical slice for The Dragon Crew.<br>
      Opening playable preview…
    </p>
    <div style="margin: 32px 0;">
      <a href="drops/dragonbound-depths/index.html" style="display: inline-block; padding: 14px 32px; border-radius: 999px; background: #ff8a5a; color: #0a0f1a; font-weight: 600; text-decoration: none; letter-spacing: 0.02em;">ENTER THE DEPTHS →</a>
    </div>
    <p style="font-size: 0.85rem; color: #6f8494;">
      FactoryX WorkOrder • factory-dragon-crew • <a href="drops/dragonbound-depths/index.html" style="color: #62b6cb;">direct link</a><br>
      (Dragon portraits remain in <code>team/avatars/generated/</code>)
    </p>
  </main>
  <script>
    // Immediate redirect for preview root (per FactoryX dragonbound-depths delivery)
    setTimeout(function(){ window.location.replace('drops/dragonbound-depths/index.html'); }, 420);
  </script>
</body>
</html>
